name: Deploy database to production

# Production schema changes go through CI, never a manual `db push` from a
# laptop. This runs when migrations land on main, or on demand for the first
# deploy. It requires three repository secrets:
#   SUPABASE_ACCESS_TOKEN  - a personal access token (supabase.com account > tokens)
#   SUPABASE_DB_PASSWORD   - the project's database password
#   SUPABASE_PROJECT_ID    - the project ref (Settings > General > Reference ID)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: production-db
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations to production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link and push migrations
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase db push
